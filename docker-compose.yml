# Optional local backends for MDRA Phase 6 (all free, all bound to 127.0.0.1).
# MDRA does not need any of these: with nothing configured it uses SQLite, local files and in-process runs.
#
#   docker compose up -d                      # redis, postgres, minio, otel-collector
#   docker compose --profile graph up -d      # + neo4j
#
# Then set the matching MDRA_* variables in .env (see docs/SCALE.md). The passwords below are local
# development defaults; override them with environment variables or a compose .env file.
name: mdra-scale

services:
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: mdra
      POSTGRES_USER: mdra
      POSTGRES_PASSWORD: ${MDRA_PG_PASSWORD:-mdra-local-dev}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdra -d mdra"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MDRA_MINIO_USER:-mdra-local}
      MINIO_ROOT_PASSWORD: ${MDRA_MINIO_PASSWORD:-mdra-local-dev}
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MC_USER: ${MDRA_MINIO_USER:-mdra-local}
      MC_PASSWORD: ${MDRA_MINIO_PASSWORD:-mdra-local-dev}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$MC_USER\" \"$$MC_PASSWORD\" >/dev/null && mc mb --ignore-existing local/mdra-artifacts"]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["127.0.0.1:4318:4318"]
    volumes: ["./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro"]

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${MDRA_NEO4J_PASSWORD:-mdra-local-dev}
    volumes: ["neo4j-data:/data"]

volumes:
  redis-data:
  postgres-data:
  minio-data:
  neo4j-data:
