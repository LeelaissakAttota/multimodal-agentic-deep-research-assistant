[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal_agentic_deep_research_assistant"
version = "1.0.0"
description = "Multimodal agentic deep research assistant: planning, tool use, cited synthesis, evaluation and supervised control over free models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Attota Leelaissak"}
]
keywords = ["agentic", "ai", "deep-research", "multimodal", "research-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100.0",
    "httpx>=0.27.0",
    "pillow>=10.0",
    "pypdf>=4.0",
    "structlog>=24.0",
    "uvicorn>=0.25.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.40",
]
test = [
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
]

[project.scripts]
deep-research-control = "deep_research.control.server:main"
deep-research-demo = "deep_research.demo:main"

[project.urls]
Homepage = "https://github.com/LeelaissakAttota/multimodal-agentic-deep-research-assistant"
Repository = "https://github.com/LeelaissakAttota/multimodal-agentic-deep-research-assistant"
Issues = "https://github.com/LeelaissakAttota/multimodal-agentic-deep-research-assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
hide_error_codes = false
show_error_codes = true
strict = true
exclude = ["tests", ".git", "__pycache__", "build", "dist"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true
