[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal_agentic_deep_research_assistant"
version = "0.1.0"
description = "A multimodal agentic deep research assistant"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Principal Agentic AI Engineer", email = "engineer@example.com"}
]
keywords = ["agentic", "ai", "deep-research", "multimodal", "research-assistant"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/example/multimodal_agentic_deep_research_assistant"
