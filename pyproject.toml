[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal_agentic_deep_research_assistant"
version = "0.1.0"
description = "A multimodal agentic deep research assistant"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Principal Agentic AI Engineer", email = "engineer@example.com"}
]
keywords = ["agentic", "ai", "deep-research", "multimodal", "research-assistant"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/example/multimodal_agentic_deep_research_assistant"

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "W", "C90"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = True
warn_unused_configs = True
hide_error_codes = False
show_error_codes = True
strict = True
exclude = ["tests", ".git", "__pycache__", "build", "dist"]
